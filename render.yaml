services:
  - type: web
    name: smk-portfolio-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
