services:
  - type: web
    name: smk-portfolio-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: syedabdulmoizkazmi0618@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_NOTIFICATION_EMAIL
        value: syedabdulmoizkazmi0618@gmail.com
